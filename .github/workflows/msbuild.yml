name: MSBuild

on: [push, pull_request]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

jobs:
  build:
    runs-on: windows-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        build_conf: [Release, Debug]

    steps:
    - uses: actions/checkout@v2

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Set environment variables
      shell: cmd
      run: |
        echo WXWIN=%GITHUB_WORKSPACE%\wxWidgets>> %GITHUB_ENV%
        echo PGDIR=%GITHUB_WORKSPACE%\postgres-binaries\pgsql>> %GITHUB_ENV%
        echo LIBSSH2DIR=%GITHUB_WORKSPACE%\libssh2-dll>> %GITHUB_ENV%

    - name: Install sphinx
      if: ${{ matrix.build_conf == 'Release' }}
      shell: cmd
      run: pip install Sphinx

    - name: Download and unpack libssh2 source
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/libssh2/libssh2/archive/refs/tags/libssh2-1.10.0.zip" -OutFile libssh2.zip
        7z.exe x libssh2.zip -o${{env.LIBSSH2DIR}}\..

    # wxWidgets headers are included in the source archive; no separate headers package needed

    - name: Download and unpack wxWidgets source
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v3.0.5/wxWidgets-3.0.5.7z" -OutFile wxWidgets-source.7z
        7z.exe x -aoa wxWidgets-source.7z -o${{env.WXWIN}}

    - name: Normalize WXWIN path
      shell: pwsh
      run: |
        $root = "${{env.WXWIN}}"
        $dirs = Get-ChildItem -Directory $root
        if ($dirs.Count -eq 1) {
          echo "WXWIN=$($dirs[0].FullName)" >> $env:GITHUB_ENV
        } else {
          echo "WXWIN=$root" >> $env:GITHUB_ENV
        }
        Write-Host "Resolved WXWIN to: $env:WXWIN"

    # Developer files (prebuilt x86) are not provided for wxWidgets >= 3.3. Build from source instead

    # Prebuilt ReleaseDLL (x86) is not provided for wxWidgets >= 3.3. Build from source instead

    - name: Download and unpack PostgreSQL
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://get.enterprisedb.com/postgresql/postgresql-10.19-1-windows-binaries.zip?ls=Crossover&type=Crossover" -OutFile postgres-binaries.zip
        7z.exe x postgres-binaries.zip -o${{env.PGDIR}}\..

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x86

    - name: Build libssh2
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: cmd
      run: |
        md libssh2-build && cd libssh2-build
        cmake -DCRYPTO_BACKEND=WinCNG -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=%LIBSSH2DIR% -DCMAKE_BUILD_TYPE=Release -A Win32 ..\libssh2-libssh2-1.10.0
        cmake --build . --target install

    - name: Build wxWidgets (Release, Win32)
      if: ${{ matrix.build_conf == 'Release' }}
      working-directory: ${{env.WXWIN}}\build\msw
      shell: cmd
      run: |
        nmake -f makefile.vc BUILD=release SHARED=1 COMPILER_VERSION=142



    - name: Verify wx setup.h (Release)
      if: ${{ matrix.build_conf == 'Release' }}
      working-directory: ${{env.WXWIN}}
      shell: cmd
      run: |
        if not exist lib\vc142_dll\mswu\wx\setup.h (
          echo Expected setup.h missing under lib\vc142_dll\mswu\wx
          dir lib
          exit /b 1
        )

    - name: Build hhp2cached (Release)
      if: ${{ matrix.build_conf == 'Release' }}
      working-directory: ${{env.WXWIN}}\utils\hhp2cached
      shell: cmd
      run: |
        if not exist ..\..\lib\vc142_dll\mswu\wx\setup.h (
          echo setup.h not found under ..\..\lib\vc142_dll\mswu\wx
          dir ..\..\lib\vc142_dll\mswu
          exit /b 1
        )
        nmake -f makefile.vc BUILD=release SHARED=1 COMPILER_VERSION=142

    - name: Build wxWidgets (Debug, Win32)
      if: ${{ matrix.build_conf == 'Debug' }}
      working-directory: ${{env.WXWIN}}\build\msw
      shell: cmd
      run: |
        nmake -f makefile.vc BUILD=debug SHARED=1 COMPILER_VERSION=142



    - name: Verify wx setup.h (Debug)
      if: ${{ matrix.build_conf == 'Debug' }}
      working-directory: ${{env.WXWIN}}
      shell: cmd
      run: |
        if not exist lib\vc142_dll\mswud\wx\setup.h (
          echo Expected setup.h missing under lib\vc142_dll\mswud\wx
          dir lib
          exit /b 1
        )

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      shell: cmd
      run: |
        msbuild /m /p:Configuration=${{matrix.build_conf}} /p:Platform=Win32 ${{env.SOLUTION_FILE_PATH}}

    - name: Check wxWidgets DLLs
      shell: cmd
      run: |
        echo Checking what DLLs exist in wxWidgets build:
        dir "wxWidgets\lib\vc142_dll\*.dll"
        echo Checking Debug vs Release DLLs:
        if "${{matrix.build_conf}}" == "Debug" (
          echo Looking for Debug DLLs with 'd' in name:
          dir "wxWidgets\lib\vc142_dll\*d*.dll"
        ) else (
          echo Looking for Release DLLs without 'd' in name:
          dir "wxWidgets\lib\vc142_dll\wxbase30u_vc_custom.dll"
          dir "wxWidgets\lib\vc142_dll\wxmsw30u_*_vc_custom.dll"
        )

    - name: Copy wxWidgets DLLs
      shell: cmd
      run: |
        echo Copying wxWidgets DLLs to match expected names:
        if "${{matrix.build_conf}}" == "Debug" (
          echo Debug build - looking for debug DLLs with 'd' in name
          if exist "wxWidgets\lib\vc142_dll\wxbase30ud_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxbase30ud_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxbase30u_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_core_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_core_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_core_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_adv_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_adv_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_adv_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_html_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_html_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_html_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_aui_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_aui_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_aui_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_gl_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_gl_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_gl_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_media_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_media_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_media_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_propgrid_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_propgrid_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_propgrid_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_ribbon_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_ribbon_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_ribbon_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_richtext_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_richtext_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_richtext_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_stc_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_stc_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_stc_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_webview_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_webview_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_webview_vc_custom.dll"
          )
          if exist "wxWidgets\lib\vc142_dll\wxmsw30ud_xrc_vc_custom.dll" (
            copy "wxWidgets\lib\vc142_dll\wxmsw30ud_xrc_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_xrc_vc_custom.dll"
          )
        ) else (
          echo Release build - copying release DLLs
          copy "wxWidgets\lib\vc142_dll\wxbase30u_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxbase30u_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_core_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_core_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_adv_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_adv_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_html_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_html_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_aui_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_aui_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_gl_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_gl_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_media_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_media_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_propgrid_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_propgrid_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_ribbon_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_ribbon_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_richtext_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_richtext_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_stc_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_stc_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_webview_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_webview_vc_custom.dll"
          copy "wxWidgets\lib\vc142_dll\wxmsw30u_xrc_vc_custom.dll" "pgadmin\${{matrix.build_conf}}\wxmsw30u_xrc_vc_custom.dll"
        )
        echo DLLs copied successfully

    - name: Find Installer Location
      shell: cmd
      run: |
        echo Looking for installer files:
        dir /s /b *.msi
        echo Looking in pkg\win32 directory:
        dir /s /b pkg\win32\*.msi

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pgAdmin3-${{matrix.build_conf}}-Win32
        path: |
          pgadmin/${{matrix.build_conf}}/pgAdmin3.exe
          pgadmin/${{matrix.build_conf}}/wx*.dll
          pkg/win32/*.msi
        retention-days: 30
